# DAPI -> CD68 U-Net Baseline Training Config

data:
  root: "../dataset/dataset/colon"
  source: "DAPI"
  target: "CD68"
  image_size: 256
  train_ratio: 0.9

model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  num_blocks: 2
  use_attention: true

loss:
  l1: 1.0
  l2: 1.0
  ssim: 0.5
  perceptual: 0.1
  edge: 0.2

training:
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  num_epochs: 200
  save_every_epochs: 2
  log_every_batches: 20
  device: "cuda"
  output_dir: "../outputs/comp_baseline"
